<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepDive Directory Viewer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 {
            margin: 0 0 10px;
            color: #0066cc;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
        }
        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            font-family: "SF Mono", Menlo, monospace;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        button {
            padding: 10px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover {
            background: #0052a3;
        }
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
            margin: 20px 0 0;
        }
        .tab {
            padding: 12px 16px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #666;
        }
        .tab.active {
            color: #0066cc;
            border-bottom-color: #0066cc;
        }
        .tab-content {
            display: none;
            padding: 20px 0;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #fafafa;
        }
        .filename {
            font-family: "SF Mono", Menlo, monospace;
            color: #0066cc;
        }
        .size {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .extension {
            display: inline-block;
            background: #e8f0fe;
            color: #0066cc;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 4px;
            margin: 15px 0;
        }
        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 12px;
            border-radius: 4px;
            margin: 15px 0;
        }
        .tree {
            font-family: "SF Mono", Menlo, monospace;
            font-size: 12px;
            line-height: 1.6;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            max-height: 500px;
            overflow-y: auto;
        }
        .tree-indent {
            display: inline-block;
            width: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 DeepDive Directory Viewer</h1>
        <p>View file inventory and directory structure of DeepDive installation.</p>

        <div class="input-group">
            <input type="text" id="pathInput" placeholder="Enter path..." value="/sessions/brave-vigilant-cannon/mnt/ai-debugscan3">
            <button onclick="loadDirectory()">Browse</button>
        </div>

        <div id="message"></div>

        <div id="infoPanel" class="info" style="display: none;">
            <div class="info-item">
                <span class="info-label">Total Files</span>
                <span class="info-value" id="totalFiles">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Total Directories</span>
                <span class="info-value" id="totalDirs">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Total Size</span>
                <span class="info-value" id="totalSize">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Scanned</span>
                <span class="info-value" id="timestamp">-</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, 'files')">Files List</button>
            <button class="tab" onclick="switchTab(event, 'tree')">Tree View</button>
            <button class="tab" onclick="switchTab(event, 'json')">JSON</button>
        </div>

        <div id="files" class="tab-content active">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50%">Path</th>
                        <th style="width: 20%">Size</th>
                        <th style="width: 15%">Type</th>
                        <th style="width: 15%">Modified</th>
                    </tr>
                </thead>
                <tbody id="filesTable"></tbody>
            </table>
        </div>

        <div id="tree" class="tab-content tree" style="display: none;"></div>
        <div id="json" class="tab-content" style="display: none;">
            <pre id="jsonOutput" style="background: #f5f5f5; padding: 15px; border-radius: 4px; overflow-x: auto;"></pre>
        </div>
    </div>

    <script>
        let currentData = null;

        function loadDirectory() {
            const path = document.getElementById('pathInput').value || '/sessions/brave-vigilant-cannon/mnt/ai-debugscan3';
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = '<div class="loading">Loading directory...</div>';

            fetch(`/tools/directory-browser.php?path=${encodeURIComponent(path)}`)
                .then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                })
                .then(data => {
                    currentData = data;
                    renderData(data);
                    msgDiv.innerHTML = '<div class="success">✓ Directory loaded successfully</div>';
                })
                .catch(e => {
                    msgDiv.innerHTML = `<div class="error">✗ Error: ${e.message}</div>`;
                });
        }

        function renderData(data) {
            // Update stats
            document.getElementById('infoPanel').style.display = 'grid';
            document.getElementById('totalFiles').textContent = data.stats.total_files.toLocaleString();
            document.getElementById('totalDirs').textContent = data.stats.total_dirs.toLocaleString();
            document.getElementById('totalSize').textContent = data.stats.total_size_human;
            document.getElementById('timestamp').textContent = data.timestamp;

            // Files table
            const tbody = document.getElementById('filesTable');
            tbody.innerHTML = '';
            data.files.forEach(f => {
                const ext = f.extension ? `<span class="extension">${f.extension}</span>` : '';
                tbody.innerHTML += `
                    <tr>
                        <td><span class="filename">${escapeHtml(f.path)}</span></td>
                        <td class="size">${f.size_human}</td>
                        <td>${ext}</td>
                        <td>${f.modified}</td>
                    </tr>
                `;
            });

            // Tree view
            const treeDiv = document.getElementById('tree');
            let treeHtml = buildTree(data);
            treeDiv.innerHTML = treeHtml;

            // JSON
            document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
        }

        function buildTree(data) {
            let html = '';

            // Add directories
            if (data.directories.length > 0) {
                html += '<strong style="color: #0066cc;">📁 Directories</strong>\n';
                data.directories.forEach(d => {
                    const depth = d.path.split('/').length - 1;
                    const indent = '<span class="tree-indent"></span>'.repeat(depth);
                    html += `${indent}📂 ${escapeHtml(d.name)}\n`;
                });
                html += '\n';
            }

            // Add files grouped by extension
            if (data.files.length > 0) {
                html += '<strong style="color: #0066cc;">📄 Files</strong>\n';
                const byExt = {};
                data.files.forEach(f => {
                    const ext = f.extension || 'other';
                    if (!byExt[ext]) byExt[ext] = [];
                    byExt[ext].push(f);
                });

                Object.keys(byExt).sort().forEach(ext => {
                    html += `<strong style="color: #666; font-size: 11px; text-transform: uppercase; margin-top: 8px;">.${ext} (${byExt[ext].length} files, ${formatTotalSize(byExt[ext])})</strong>\n`;
                    byExt[ext].forEach(f => {
                        const depth = f.path.split('/').length - 1;
                        const indent = '<span class="tree-indent"></span>'.repeat(depth);
                        html += `${indent}📄 ${escapeHtml(f.name)} <span style="color: #999;">(${f.size_human})</span>\n`;
                    });
                });
            }

            return html;
        }

        function formatTotalSize(files) {
            const total = files.reduce((s, f) => s + f.size_bytes, 0);
            const units = ['B', 'KB', 'MB', 'GB'];
            let size = total;
            let unitIdx = 0;
            while (size >= 1024 && unitIdx < units.length - 1) {
                size /= 1024;
                unitIdx++;
            }
            return `${size.toFixed(1)} ${units[unitIdx]}`;
        }

        function switchTab(e, tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function escapeHtml(text) {
            const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Load on page load
        window.addEventListener('load', loadDirectory);
    </script>
</body>
</html>
