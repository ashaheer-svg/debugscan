id: network.bond_failover
version: 2
title: "Bond slave interface went down"
severity: warn
actionability: user_fixable
category: network
description: >
  An active member of a link-aggregation bond failed, forcing traffic
  onto remaining slaves. The system remains reachable but at reduced
  throughput and with no further redundancy until the failed slave
  recovers.
remediation: >
  Inspect the physical link and switch-side port configuration. Bonds
  configured in active-backup mode tolerate this; LACP/802.3ad bonds
  require matching switch configuration and both sides must agree.
tags: [network, bond, lacp]
signature:
  type: regex
  source: messages
  pattern: 'bond\d+.*link status definitely down for interface (?P<iface>\S+)'
  dedupe_by: iface
entities:
  interface: "$match.iface"
