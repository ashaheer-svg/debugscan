location ^~ /abbcms/ {
    rewrite ^/abbcms/(.+)$ /$1 break;
	location ~ \.cgi {
		root /usr/syno/synoman;
		rewrite             ^/abbcms/(.*)$ /$1 break;
		scgi_read_timeout   3600s;
		include     scgi_params;
		scgi_pass   synoscgi;
	}

	location ~ /abbcms/api/v1/portal {
		rewrite ^/abbcms/(.+)$ /$1 break;
		include proxy.conf;
		proxy_read_timeout   3600s;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_pass http://localhost:8000;
	}
}
